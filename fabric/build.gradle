plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    implementation(project(':irohnet'))
    include(project(':irohnet'))
    include("computer.iroh:iroh:${iroh_version}")
    include("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}")
    include("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutines_version}")
    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
        exclude(group: 'net.fabricmc')
    }
    include("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Shedaniel'
                url = uri('https://maven.shedaniel.me/')
            }
        }
        filter {
            includeGroup('me.shedaniel.cloth')
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // Joins a server straight from the launch args, which is the only way to exercise the
            // full connect path without driving the UI by hand:
            //   ./gradlew :fabric:runClient -PquickPlay=<connect id>
            if (project.hasProperty('quickPlay')) {
                programArgs('--quickPlayMultiplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
